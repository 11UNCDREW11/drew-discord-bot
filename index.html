<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>League Hub</title>
  <meta name="description" content="Standings, stats, schedules, rosters, and cap sheets for the league.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="#/" id="league-name">League Hub</a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="home">Standings</a>
        <a href="#/schedule" data-nav="schedule">Schedule</a>
        <a href="#/teams" data-nav="teams">Teams</a>
        <a href="#/players" data-nav="players">Players</a>
        <a href="#/leaders" data-nav="leaders">Leaders</a>
      </nav>
      <div class="controls">
        <label class="control">
          <span>Season</span>
          <select id="season-select" aria-label="Season"></select>
        </label>
        <label class="control">
          <span>Follow</span>
          <select id="follow-select" aria-label="Team to highlight">
            <option value="">No team</option>
          </select>
        </label>
      </div>
    </div>
  </header>
  <main id="view" tabindex="-1" aria-live="polite">
    <p class="loading">Loading league data…</p>
  </main>
  <footer class="footer">
    <p>Results update as soon as a game report is final. Times are shown in your time zone.</p>
  </footer>
  <script src="/app.js" defer></script>
</body>
</html>
